<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能检索问答 - 企业级 RAG 系统</title>
    <script src="/static/vue.global.prod.js"></script>
    <script src="/static/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .container {
            background: #fff;
            border-radius: 0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            width: 1200px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            padding: 20px 24px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn-sm {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-outline {
            background: #fff;
            color: #667eea;
            border: 1px solid #667eea;
        }
        .btn-outline:hover { background: #f0f3ff; }
        .thread-id {
            font-size: 11px;
            color: #bbb;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            display: flex;
            gap: 10px;
            max-width: 85%;
        }
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message.assistant {
            align-self: flex-start;
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .avatar.user { background: #667eea; }
        .avatar.assistant { background: #f0f3ff; }
        .bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
        }
        .bubble.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .bubble.assistant {
            background: #f5f6f8;
            color: #333;
            border-bottom-left-radius: 4px;
        }
        /* ---------- Markdown 渲染样式 ---------- */
        .bubble.assistant h1, .bubble.assistant h2, .bubble.assistant h3,
        .bubble.assistant h4, .bubble.assistant h5, .bubble.assistant h6 {
            margin: 12px 0 6px;
            font-weight: 600;
            line-height: 1.4;
        }
        .bubble.assistant h1 { font-size: 1.4em; }
        .bubble.assistant h2 { font-size: 1.25em; }
        .bubble.assistant h3 { font-size: 1.1em; }
        .bubble.assistant p { margin: 4px 0; }
        .bubble.assistant ul, .bubble.assistant ol {
            margin: 4px 0;
            padding-left: 20px;
        }
        .bubble.assistant li { margin: 2px 0; }
        .bubble.assistant code {
            background: #e8e8e8;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, monospace;
            font-size: 0.9em;
            color: #d63384;
        }
        .bubble.assistant pre {
            background: #1e1e2e;
            color: #cdd6f4;
            padding: 14px 18px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
            font-size: 13px;
            line-height: 1.5;
        }
        .bubble.assistant pre code {
            background: none;
            padding: 0;
            color: inherit;
            font-size: inherit;
        }
        .bubble.assistant blockquote {
            border-left: 3px solid #667eea;
            padding: 4px 12px;
            margin: 8px 0;
            color: #666;
            background: #f0f3ff;
            border-radius: 0 6px 6px 0;
        }
        .bubble.assistant table {
            border-collapse: collapse;
            margin: 8px 0;
            width: 100%;
            font-size: 13px;
        }
        .bubble.assistant th, .bubble.assistant td {
            border: 1px solid #ddd;
            padding: 6px 12px;
            text-align: left;
        }
        .bubble.assistant th {
            background: #f5f6f8;
            font-weight: 600;
        }
        .bubble.assistant a {
            color: #667eea;
            text-decoration: none;
        }
        .bubble.assistant a:hover { text-decoration: underline; }
        .bubble.assistant hr {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin: 12px 0;
        }
        .bubble.assistant strong { font-weight: 600; }
        .bubble.assistant em { font-style: italic; }
        .bubble.assistant img { max-width: 100%; border-radius: 6px; margin: 4px 0; }
        /* ---------- 参考来源样式 ---------- */
        .sources-box {
            margin-bottom: 12px;
            padding: 10px 14px;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
        }
        .sources-title {
            font-size: 12px;
            font-weight: 600;
            color: #888;
            margin-bottom: 6px;
        }
        .source-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            padding: 3px 0;
        }
        .source-badge {
            font-size: 14px;
            flex-shrink: 0;
        }
        .source-link {
            color: #667eea;
            text-decoration: none;
            word-break: break-all;
            flex: 1;
        }
        .source-link:hover {
            text-decoration: underline;
        }
        .source-text {
            color: #333;
            flex: 1;
        }
        .source-score {
            font-size: 11px;
            font-weight: 600;
            color: #999;
            white-space: nowrap;
        }

        .bubble.assistant.streaming::after {
            content: '\258D';
            animation: blink 1s infinite;
            color: #667eea;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #bbb;
        }
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .empty-text { font-size: 16px; }
        .input-area {
            padding: 24px 24px 32px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .input-box {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
            resize: none;
            min-height: 52px;
        }
        .input-box:focus { border-color: #667eea; }
        .input-box:disabled { background: #f9f9f9; }
        .btn-send {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-send:hover { opacity: 0.9; }
        .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #bbb;
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }
    </style>
</head>
<body>
<div id="app">
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <span class="header-title">🔍 智能检索问答</span>
            <div class="header-actions">
                <span class="thread-id" :title="threadId">会话: {{ threadId.slice(0, 8) }}</span>
                <button class="btn-sm btn-outline" @click="newSession">新会话</button>
            </div>
        </div>

        <!-- 消息区域 -->
        <div class="messages" ref="messageContainer">
            <div v-if="messages.length === 0" class="empty-state">
                <div class="empty-icon">💬</div>
                <div class="empty-text">输入问题开始对话</div>
            </div>
            <div
                v-for="(msg, idx) in messages"
                :key="idx"
                class="message"
                :class="msg.role"
            >
                <div class="avatar" :class="msg.role">
                    {{ msg.role === 'user' ? '🙋' : '🤖' }}
                </div>
                <div
                    class="bubble"
                    :class="[msg.role, { streaming: msg.streaming }]"
                >
                    <template v-if="msg.role === 'user'">{{ msg.content }}</template>
                    <template v-else>
                        <div v-if="msg.sources && msg.sources.length" class="sources-box">
                            <div class="sources-title">📎 参考来源（共 {{ msg.sources.length }} 条）</div>
                            <div v-for="(src, si) in msg.sources" :key="si" class="source-item">
                                <span class="source-badge">{{ src.source === 'web' ? '🌐' : '📄' }}</span>
                                <a v-if="src.url" :href="src.url" target="_blank" class="source-link">{{ src.title }}</a>
                                <span v-else class="source-text">{{ src.title }}</span>
                                <span v-if="src.score != null" class="source-score">{{ (src.score * 100).toFixed(1) }}%</span>
                            </div>
                        </div>
                        <div v-html="msg.contentHtml"></div>
                    </template>
                </div>
            </div>
            <!-- 思考中动画 -->
            <div v-if="thinking" class="message assistant">
                <div class="avatar assistant">🤖</div>
                <div class="bubble assistant">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 输入区域 -->
        <div class="input-area">
            <textarea
                v-model="inputText"
                class="input-box"
                rows="1"
                placeholder="输入你的问题..."
                :disabled="sending"
                @keydown.enter.exact.prevent="sendMessage"
            ></textarea>
            <button
                class="btn-send"
                :disabled="!inputText.trim() || sending"
                @click="sendMessage"
            >↑</button>
        </div>
    </div>
</div>

<script>
const { createApp, nextTick } = Vue;

function generateId() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
}

createApp({
    data() {
        return {
            messages: [],
            inputText: '',
            threadId: generateId(),
            sending: false,
            thinking: false,
        };
    },
    methods: {
        /** 将 Markdown 字符串转换为 HTML */
        renderMarkdown(text) {
            if (typeof marked !== 'undefined') {
                return marked.parse(text, { breaks: true });
            }
            // 兜底：简单的 HTML 转义 + 换行转 <br>
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\n/g, '<br>');
        },
        newSession() {
            this.messages = [];
            this.threadId = generateId();
            this.inputText = '';
            this.sending = false;
            this.thinking = false;
            // 取消进行中的请求，防止竞态条件
            if (this._abortController) {
                this._abortController.abort();
                this._abortController = null;
            }
        },
        async sendMessage() {
            const text = this.inputText.trim();
            if (!text || this.sending) return;

            // 添加用户消息
            this.messages.push({ role: 'user', content: text, contentHtml: text });
            this.inputText = '';
            this.sending = true;
            this.thinking = true;
            await this.scrollToBottom();

            // 添加空的 AI 回复（用于流式更新）
            const aiIndex = this.messages.length;
            this.messages.push({ role: 'assistant', content: '', contentHtml: '', streaming: true, sources: [] });

            // 创建 AbortController 以便取消请求
            this._abortController = new AbortController();

            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: text,
                        thread_id: this.threadId,
                    }),
                    signal: this._abortController.signal,
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    let eventType = '';
                    let eventData = '';

                    for (const line of lines) {
                        if (line.startsWith('event: ')) {
                            eventType = line.slice(7).trim();
                        } else if (line.startsWith('data: ')) {
                            eventData = line.slice(6).trim();
                            if (eventType && eventData) {
                                this.handleEvent(eventType, eventData, aiIndex);
                                eventType = '';
                                eventData = '';
                            }
                        }
                    }
                }
            } catch (e) {
                // AbortError 是用户主动取消，不需要显示错误
                if (e.name !== 'AbortError') {
                    this.messages[aiIndex].content = '请求失败: ' + e.message;
                    this.messages[aiIndex].contentHtml = this.renderMarkdown(this.messages[aiIndex].content);
                    this.messages[aiIndex].streaming = false;
                }
            } finally {
                this.sending = false;
                this.thinking = false;
                if (this.messages[aiIndex]) {
                    this.messages[aiIndex].streaming = false;
                }
                await this.scrollToBottom();
            }
        },
        handleEvent(eventType, rawData, aiIndex) {
            try {
                const data = JSON.parse(rawData);
                if (eventType === 'source') {
                    this.messages[aiIndex].sources = data.sources || [];
                } else if (eventType === 'answer_delta') {
                    this.messages[aiIndex].content += data.delta || '';
                    this.messages[aiIndex].contentHtml = this.renderMarkdown(this.messages[aiIndex].content);
                    this.scrollToBottom();
                } else if (eventType === 'error') {
                    this.messages[aiIndex].content = '回答失败: ' + (data.message || '未知错误');
                    this.messages[aiIndex].contentHtml = this.renderMarkdown(this.messages[aiIndex].content);
                }
                // step 事件可用于后续扩展，当前版本仅用于调试
            } catch (e) {
                console.error('解析 SSE 事件失败:', e);
            }
        },
        async scrollToBottom() {
            await nextTick();
            const container = this.$refs.messageContainer;
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
        },
    },
}).mount('#app');
</script>
</body>
</html>
